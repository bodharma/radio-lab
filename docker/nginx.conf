worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /course.json {
            alias /course/course.json;
            add_header Cache-Control "no-store" always;
        }

        location = /reference/ex307-jan-2026.pdf {
            root /course;
            try_files /reference/ex307-jan-2026.pdf @official_booklet;
            add_header Cache-Control "no-cache" always;
        }

        location @official_booklet {
            return 302 https://rsgb.services/public/exams/exam-forms/260122_EX307_Foundation_v1.pdf;
        }

        location = /reference/ex307-jan-2026.json {
            alias /course/reference/ex307-jan-2026.json;
            add_header Cache-Control "no-cache" always;
        }

        location = /reference/ex307-jan-2026-chart.png {
            alias /course/reference/ex307-jan-2026-chart.png;
            add_header Cache-Control "no-cache" always;
        }

        location = /index.html {
            add_header Cache-Control "no-cache" always;
        }

        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            try_files $uri $uri/ =404;
            add_header Cache-Control "no-cache" always;
        }
    }
}
